name: Guarda da main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: main-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Commit na main sem PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verificar que cada commit veio de PR
        run: node scripts/main-guard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
