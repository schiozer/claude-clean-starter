name: Guarda da main

# Com a esteira (bloco `esteira` em hooks/protect-main/config.json) a guarda vale também para a
# integração (`develop`). Sem esteira, o script ignora o push na `develop` e sai ok.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  checks: read
  deployments: read
  issues: write

concurrency:
  group: main-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Commit na main sem PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verificar que cada commit veio de PR
        run: node scripts/main-guard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_GATE: ${{ vars.SPEC_GATE }}
