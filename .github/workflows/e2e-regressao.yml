name: Regressão (UAT)

# Check obrigatório (spec e2e-regressao-docs §8.2): roda `@regressao` + os cenários novos/alterados
# das specs do PR. Alvo: o Preview da Vercel do SHA do PR (`vars.E2E_TARGET == 'preview'`) ou, no
# template / antes do bootstrap, o app local subido pelo `webServer` do Playwright.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  deployments: read
  pull-requests: write

concurrency:
  group: e2e-regressao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regressao:
    name: Regressão (UAT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # histórico completo: os cenários do PR saem do diff com origin/<base>.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências do app de exemplo
        if: hashFiles('examples/walking-skeleton/package.json') != ''
        working-directory: examples/walking-skeleton
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Aguardar o deploy Preview da Vercel
        id: preview
        if: vars.E2E_TARGET == 'preview'
        run: node scripts/e2e/wait-preview.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Filtro da regressão (@regressao + cenários do PR)
        id: grep
        run: node scripts/e2e/grep-regressao.mjs

      # Segredos só no modo preview: no modo local ficam vazios e o playwright.config.ts preenche
      # os PATs e o segredo de falhas do app local.
      - name: Regressão (Playwright)
        run: npm run test:e2e -- --grep "$E2E_GREP"
        env:
          CI: '1'
          E2E_GREP: ${{ steps.grep.outputs.grep }}
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_AUTH: ${{ vars.E2E_TARGET == 'preview' && 'auth0' || '' }}
          E2E_RUN_PREFIX: ${{ vars.E2E_TARGET == 'preview' && github.run_id || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ vars.E2E_TARGET == 'preview' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          E2E_FAULTS_SECRET: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_FAULTS_SECRET || '' }}
          E2E_PAT_USUARIO: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_PAT_USUARIO || '' }}
          E2E_PAT_SEM_ESCOPO: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_PAT_SEM_ESCOPO || '' }}
          E2E_PAT_RATE_LIMIT: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_PAT_RATE_LIMIT || '' }}
          E2E_PAT_OUTRO_ATOR: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_PAT_OUTRO_ATOR || '' }}
          E2E_USUARIO_EMAIL: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_USUARIO_EMAIL || '' }}
          E2E_USUARIO_SENHA: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_USUARIO_SENHA || '' }}
          E2E_INTERNO_EMAIL: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_INTERNO_EMAIL || '' }}
          E2E_INTERNO_SENHA: ${{ vars.E2E_TARGET == 'preview' && secrets.E2E_INTERNO_SENHA || '' }}

      # Só para o relatório de rastreabilidade: quem bloqueia é o passo do `PR gate`.
      - name: Cenários × testes (relatório)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run check:cenarios

      # Sensível: traces/relatório do Playwright guardam o header de bypass da Vercel e o
      # `x-e2e-secret`; artefato curto (7 dias), nunca publicado em lugar público.
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-uat-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Upsert por marcador (não `gh pr comment --edit-last`): o `Spec × código` comenta com o
      # mesmo bot e não pode ser sobrescrito. PR de fork (token só leitura) não derruba o check.
      - name: Comentar o resultado no PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STATUS: ${{ job.status }}
          ALVO: ${{ steps.preview.outputs.url || 'app local (webServer)' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- e2e-regressao -->'
          case "$STATUS" in
            success) RESULTADO='verde' ;;
            cancelled) RESULTADO='cancelada' ;;
            *) RESULTADO='vermelha' ;;
          esac
          BODY="$MARKER
          **Regressão (UAT)**: $RESULTADO — alvo: $ALVO.
          Relatório do Playwright e rastreabilidade nos artefatos do [run]($RUN_URL) (7 dias)."
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | tail -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
