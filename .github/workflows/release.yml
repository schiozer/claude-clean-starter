name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag e release por merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Criar tag SemVer e GitHub Release
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
