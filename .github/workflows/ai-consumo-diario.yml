name: Consumo diário de IA

# Só faz algo no hub (ai-observabilidade.config.json com `central: true`); nos demais sai 0.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumo-diario:
    name: Resumo diário no Neon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descobrir o papel (hub ou não)
        id: papel
        run: |
          node -e "let h=false;try{const c=JSON.parse(require('fs').readFileSync('ai-observabilidade.config.json','utf8'));h=c.ativo===true&&c.central===true}catch{}console.log('hub='+h)" >> "$GITHUB_OUTPUT"

      - if: steps.papel.outputs.hub == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Gravar consumo do dia anterior
        if: steps.papel.outputs.hub == 'true'
        env:
          GRAFANA_API_URL: ${{ secrets.GRAFANA_API_URL }}
          GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          AI_OBS_DATABASE_URL: ${{ secrets.AI_OBS_DATABASE_URL }}
        run: npm ci && npm run ai-obs:consumo-diario
