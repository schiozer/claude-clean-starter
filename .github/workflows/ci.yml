name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (root)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Check runbooks (ADR-013)
        # Projeto adotado: troque por `npm run check:runbooks -- --strict`.
        run: npm run check:runbooks

  example:
    name: Walking Skeleton (example)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/walking-skeleton
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: Build
        run: npm run build
        env:
          RESOURCES_ENABLED: 'on'
